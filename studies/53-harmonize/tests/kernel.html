<!doctype html>
<meta charset="utf-8">
<title>Study 53 · harmonize · kernel tests</title>
<pre id="out">Running…</pre>
<script type="module">
// The kernels (the same tests run in Node: node -e 'import("./studies/53-harmonize/tests/kernel.mjs").then(async m => process.exit(m.report(await m.run())))').
try {
  const { run } = await import("./kernel.mjs");
  const { results: rs, notes } = await run(), bad = rs.filter((r) => !r[1]);
  window.kairoticResults = { total: rs.length, failed: bad.map((r) => r[0]) };
  document.getElementById("out").textContent = (rs.length - bad.length) + " / " + rs.length + " passed\n\n" +
    rs.map((r) => (r[1] ? "  ok   " : "  FAIL ") + r[0]).join("\n") + "\n\n" + notes.map((n) => "  · " + n).join("\n");
} catch (e) {
  document.getElementById("out").textContent = "Error: " + (e.message || e);
  window.kairoticResults = { total: 0, failed: ["error: " + (e.message || e)] };
}
</script>
