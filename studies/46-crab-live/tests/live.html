<!doctype html>
<meta charset="utf-8">
<title>Study 46 · crab live · game tests</title>
<pre id="out">Running…</pre>
<script type="module">
// The game, on Study 43's kernel (the same tests run in Node: node studies/46-crab-live/tests/live.mjs).
try {
  const { run } = await import("./live.mjs");
  const rs = run(), bad = rs.filter((r) => !r[1]);
  window.kairoticResults = { total: rs.length, failed: bad.map((r) => r[0]) };
  document.getElementById("out").textContent = (rs.length - bad.length) + " / " + rs.length + " passed\n\n" +
    rs.map((r) => (r[1] ? "  ok   " : "  FAIL ") + r[0]).join("\n");
} catch (e) {
  document.getElementById("out").textContent = "Error: " + (e.message || e);
  window.kairoticResults = { total: 0, failed: ["error: " + (e.message || e)] };
}
</script>
