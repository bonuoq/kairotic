<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<meta charset="utf-8">
<title>Study 46 · crab live · page tests</title>
<pre id="out">Running…</pre>
<div id="host"></div>
<script src="https://cdn.jsdelivr.net/npm/scittle@0.7.30/dist/scittle.js"></script>
<script type="module">
// The study's page itself (styles, markup, the kernel, kairotic/live.cljs and the page's ClojureScript), played as a person would: by turns with the keys,
// then on a pulse whose beats the test gives by hand.
await (async function () {
  const results = [], errors = [];
  window.addEventListener("error", (e) => errors.push(String(e.message || e)));
  const is = (what, ok) => results.push([what, !!ok]);
  const C = () => window.kairoticCrab;
  const okKeys = () => [...document.querySelectorAll("#keys .key.ok")];
  const ready = async () => { for (let i = 0; i < 400 && !C().ready(); i++) await new Promise((r) => setTimeout(r, 25)); return C().ready(); };
  const change = (id, v) => { const el = document.getElementById(id); el.value = v; el.dispatchEvent(new Event("change", { bubbles: true })); };
  try {
    const html = await fetch("../index.html", { cache: "no-cache" }).then((r) => r.text());
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("style").forEach((s) => document.head.appendChild(s.cloneNode(true)));
    document.getElementById("host").appendChild(doc.querySelector("main").cloneNode(true));
    window.kairoticKernel = await import("../kairotic/kernel.mjs");
    window.kairoticMirror = await import("../kairotic/mirror.mjs");
    window.kairoticSound = await import("../kairotic/sound.mjs");
    scittle.core.eval_string(await fetch("../kairotic/live.cljs", { cache: "no-cache" }).then((r) => r.text()));
    scittle.core.eval_string(doc.getElementById("page-cljs").textContent);
    const snd = document.getElementById("sound"); snd.checked = false; snd.dispatchEvent(new Event("change", { bubbles: true }));
    is("the crabs are counted first, without blocking the page", /counting/.test(document.getElementById("status").textContent) && await ready());
    const o = C().kernel(), n = o.n, mid = o.steps;

    is("a crab of 5 bars: 9 beats, the middle after beat 5", n === 9 && mid === 5);
    is("it begins choosing: the notes that can close it, with their ways", okKeys().length > 0 && document.querySelectorAll("#score .cand").length === okKeys().length);
    is("the score not out yet", /comes out at the middle/.test(document.getElementById("outlet").textContent));

    okKeys()[0].click();
    is("by turns: a note in is a beat", C().game().t === 1);
    is("the engine answered: its note at beat 1, and the end of your line written ahead", document.querySelectorAll("#score .comes").length === 1 && document.querySelectorAll("#score .dux.ahead").length === 1);
    // a note that cannot close it: the nearest that can
    const bad = [...document.querySelectorAll("#keys .key:not(.ok)")][0];
    if (bad) { bad.click(); is("a note that cannot close it is played as the nearest that can, and said", /cannot close the crab/.test(document.getElementById("log").textContent)); }
    else is("(every note could close it here)", true);
    while (C().game().t < mid) okKeys()[0].click();
    is("at the middle the score comes out: the rest of your line", /^\[\[6 /.test(document.getElementById("outlet").textContent) && C().game().score.length === n - mid);
    is("... and it is marked to be read", document.querySelectorAll("#score .readzone").length === 1 && document.querySelectorAll("#score .readnow").length === 1);
    is("reading: only the written note is lit", okKeys().length === 1 && +okKeys()[0].dataset.play === C().game().M[mid]);
    while (C().game().t < n) okKeys()[0].click();
    is("finished", /finished/.test(document.getElementById("status").textContent));
    const g = C().game();
    is("the crab as played: the engine's voice is yours backwards", g.log.every((b) => b.engine === o.T(g.M[n - 1 - b.t])));
    is("and the kernel accepts it", o.count(g.M, o.steps) === 1);

    // on a pulse: the beats given by hand; nothing played → the engine plays for you
    document.querySelector('input[name=timing][value=pulse]').click();
    await ready();
    is("pulse: a new crab, waiting for its start", C().ui().timing === "pulse" && C().game().t === 0 && /Start the pulse/.test(document.getElementById("go").textContent));
    C().tick();
    is("a beat with nothing played: the engine plays your note for you", C().game().t === 1 && C().game().log[0].auto === true);
    const x = +okKeys()[0].dataset.play;
    okKeys()[0].click();
    is("a note played waits for the beat", C().game().t === 1 && document.querySelectorAll("#keys .key.hot").length === 1);
    C().tick();
    is("... and is played on it", C().game().t === 2 && C().game().M[1] === x);
    for (let i = 0; i < n; i++) C().tick();
    is("on a pulse the second half goes on by itself, to the end", /finished/.test(document.getElementById("status").textContent));

    change("kind", "table"); await ready();
    is("a table canon: a new one", C().kernel().kind === "table" && C().game().t === 0);

    // 3/2, by turns: 4 bars, 10 beats, a middle of two
    change("kind", "crab"); document.querySelector('input[name=timing][value=turns]').click(); change("meter", "3"); change("bars", 4);
    is("3/2: counted", await ready());
    const o3 = C().kernel();
    is("3/2: 4 bars are 10 beats, its middle a pair (beats 5 and 6)", o3.n === 10 && o3.spec.b === 3 && o3.order[o3.steps - 1].length === 2);
    is("3/2: a bar line every three beats", document.querySelectorAll("#score .barline").length === 4);
    while (C().game().t < o3.n) okKeys()[0].click();
    const g3 = C().game();
    is("3/2: played to the end, a crab the kernel accepts", /finished/.test(document.getElementById("status").textContent) && o3.count(g3.M, o3.steps) === 1);
    change("bars", 7);
    is("3/2: at most 5 bars", C().kernel().spec.b === 3 && C().ui().bars === 5 && await ready());
    is("no error on the page", errors.length === 0);
  } catch (e) {
    is("the page ran: " + (e.message || e), false);
  }
  const bad = results.filter((r) => !r[1]).map((r) => r[0]);
  window.kairoticResults = { total: results.length, failed: bad.concat(errors.map((e) => "error: " + e)) };
  document.getElementById("out").textContent = (results.length - bad.length) + " / " + results.length + " passed\n\n" +
    results.map((r) => (r[1] ? "  ok   " : "  FAIL ") + r[0]).join("\n") + (errors.length ? "\n\n" + errors.join("\n") : "");
})();
</script>
