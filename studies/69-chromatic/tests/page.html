<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<meta charset="utf-8">
<title>Study 69 · chromatic · page tests</title>
<pre id="out">Running…</pre>
<iframe id="page" src="../index.html" style="width:1280px;height:1000px;border:0"></iframe>
<script type="module">
// The study's page itself, in a frame: the Fonte counted and realized, the keys of a tonicization boxed, the Lamento in
// three parts, a transposition, the export.
const results = [], errors = [];
const is = (what, ok) => results.push([what, !!ok]);
const frame = document.getElementById("page");
await new Promise((r) => frame.addEventListener("load", r, { once: true }));
const w = frame.contentWindow, d = frame.contentDocument;
w.addEventListener("error", (e) => errors.push(String(e.message || e)));
const wait = async (ok, ms = 20000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { try { if (ok()) return true; } catch (e) {} await new Promise((r) => setTimeout(r, 50)); } return false; };
const total = () => d.getElementById("total").textContent;
const msg = () => d.getElementById("msg").textContent;
const figs = () => [...d.querySelectorAll("#sheet text.fig")].map((x) => x.textContent);
const keys = () => [...d.querySelectorAll("#sheet .keylab")].map((x) => x.textContent);
try {
  await wait(() => w.kairoticChromatic && /^\d/.test(total()));
  const K = w.kairoticChromatic;
  is("it opens on the Fonte in C major: 181 realizations, twelve phrases to choose", total() === "181" && d.querySelector('[data-phrase="fonte"]').classList.contains("on") && d.querySelectorAll("[data-phrase]").length === 12);
  is("... the engine's realization drawn, sound, ii tonicized: D minor boxed, then C major", d.querySelectorAll("#sheet rect.upper").length > 0 && !/✗/.test(msg()) && keys().join(" · ") === "D minor · C major" && figs()[0] === "6/5/3");
  K.set("monte");
  await wait(() => total() === "6,852");
  is("the chromatic Monte: 6,852, ii, IV, V and vi boxed", keys().join(" · ") === "C major · D minor · F major · G major · A minor · C major");
  K.set("lamento");
  await wait(() => total() === "6");
  is("the Lamento in three parts: 6, two upper voices drawn", d.getElementById("parts-h").textContent.startsWith("Three parts") && d.querySelectorAll("#sheet rect.tenor").length === 0 && d.querySelectorAll("#sheet rect.middle").length > 0 && !/✗/.test(msg()));
  K.set("chain", "D");
  await wait(() => total() === "36");
  is("the Chain of Dominants moved to D: the same 36, the dominants of B minor, E minor, A, D", keys().slice(1, 5).join(" · ") === "B minor · E minor · A major · D major");
  d.getElementById("uniform").click();
  is("any valid one, sound", !/✗/.test(msg()) && /steps/.test(msg()));
  const saved = [];
  w.claude = { use: async (n) => (n === "downloads" ? { save: async (o) => { saved.push({ filename: o.filename, text: await o.data.text() }); return { status: "saved" }; } } : null) };
  d.getElementById("export").click();
  is("exported for the app: four voices, the chords, the keys in its extMeta", await wait(() => saved.length === 1) && ["soprano", "alto", "tenor", "bass"].every((v) => saved[0].text.includes(`label="${v}"`)) && /:source "Kairotic Study 69 · chromatic"/.test(saved[0].text));
  is("no errors on the page", errors.length === 0);
} catch (e) { is("error: " + (e.message || e), false); }
const bad = results.filter((r) => !r[1]);
window.kairoticResults = { total: results.length, failed: bad.map((r) => r[0]).concat(errors) };
document.getElementById("out").textContent = `${results.length - bad.length} / ${results.length} passed\n\n` + results.map(([w, ok]) => (ok ? "  ok   " : "  FAIL ") + w).join("\n") + (errors.length ? "\n\nerrors:\n" + errors.join("\n") : "");
</script>
