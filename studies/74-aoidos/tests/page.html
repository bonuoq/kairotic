<!doctype html>
<meta charset="utf-8">
<title>Study 74 · aoidos · page tests</title>
<pre id="out">Running…</pre>
<iframe id="page" src="../index.html" style="width:1320px;height:1000px;border:0"></iframe>
<script type="module">
// The study's page itself, in a frame: Odyssey 1.1 read, scanned, counted and sung; strict; in canon; Seikilos;
// imitable?; the export, with the text under the dux.
const results = [], errors = [];
const is = (what, ok) => results.push([what, !!ok]);
const frame = document.getElementById("page");
await new Promise((r) => frame.addEventListener("load", r, { once: true }));
const w = frame.contentWindow, d = frame.contentDocument;
w.addEventListener("error", (e) => errors.push(String(e.message || e)));
const wait = async (ok, ms = 30000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { try { if (ok()) return true; } catch (e) {} await new Promise((r) => setTimeout(r, 50)); } return false; };
const total = () => (d.getElementById("total") || {}).textContent || "";
const report = () => d.getElementById("report").textContent;
const status = () => d.getElementById("status").textContent;
try {
  await wait(() => w.kairoticAoidosPage && /^\d/.test(total()) && status() === "sung");
  const P = w.kairoticAoidosPage;
  is("it opens on Odyssey 1.1, scanned (five dactyls and a spondee) and counted: 135,750,965,863,333,805 melodies (up to three notes a syllable)",
     total() === "135,750,965,863,333,805" && d.querySelector("#scansion .sc").textContent === "– ⏑ ⏑ | – ⏑ ⏑ | – ⏑ ⏑ | – ⏑ ⏑ | – ⏑ ⏑ | – –");
  is("... sung: a note or more a syllable drawn, the 17 syllables under them, every rule kept", d.querySelectorAll("#sheet rect.dux").length >= 17 && d.querySelectorAll("#sheet text.syl").length === 17 && /✓ every rule kept/.test(report()));
  d.getElementById("strict").click();
  await wait(() => total() === "3,972,124,968,366,906" && status() === "sung");
  is("strict: 3,972,124,968,366,906, the peak always kept", total() === "3,972,124,968,366,906" && /the accent the word's highest (\d+)\/\1/.test(report()));
  d.getElementById("melisma").value = "1";
  P.set("odyssey", "canon");
  await wait(() => total() === "7,823" && status() === "sung");
  is("in canon (strict, a note a syllable, the comes an octave below a foot later): 7,823 canons, both voices drawn",
     total() === "7,823" && d.querySelectorAll("#sheet rect.comes").length > 0 && /✓ every rule kept/.test(report()));
  P.set("seikilos", "canon");
  await wait(() => total() === "175,807" && status() === "sung");
  is("Seikilos's song in canon, in its own rhythm, strict, a note a syllable, E dorian: 175,807; four lines scanned", total() === "175,807" && d.querySelectorAll("#scansion .ln").length === 4);
  d.getElementById("strict").click();
  d.getElementById("melisma").value = "3";
  P.set("seikilos", "melody");
  await wait(() => /^\d/.test(total()) && status() === "sung" && !d.getElementById("stele").hidden);
  d.getElementById("stele").click();
  is("the stele's own melody: every rule of the engine kept, six melismas, the accent as the stele keeps it (peak 9/10)",
     P.state().stele && /the stele's melody/.test(report()) && /✓ every rule kept/.test(report()) && /melismas 6/.test(report()) && /the accent the word's highest 9\/10/.test(report()));
  P.set("odyssey", "melody");
  await wait(() => total() === "135,750,965,863,333,805" && status() === "sung");
  d.getElementById("examine").click();
  await wait(() => d.querySelectorAll("#exam tr").length > 1 && status() === "tried", 60000);
  is("imitable?: the melody tried as a dux at 24 distances, entries and degrees", d.querySelectorAll("#exam tr").length === 25);
  const plays = d.querySelectorAll("#exam button[data-row]");
  is("... a ▶ on every row that has a comes, and it plays", plays.length > 0 && plays.length === [...d.querySelectorAll("#exam td.yes")].length && (plays[0].click(), await wait(() => status() === "playing the imitation", 3000)));
  const saved = [];
  w.claude = { use: async (n) => (n === "downloads" ? { save: async (o) => { saved.push({ filename: o.filename, text: await o.data.text() }); return { status: "saved" }; } } : null) };
  d.getElementById("export").click();
  is("exported for the app: the dux, the text in its extMeta", await wait(() => saved.length === 1) && saved[0].text.includes('label="dux"') && /:source "Kairotic Study 74 · aoidos"/.test(saved[0].text) && saved[0].text.includes("Μοῦσα"));
  const syls = saved[0] ? [...saved[0].text.matchAll(/<verse n="1"><syl([^>]*)>([^<]*)<\/syl><\/verse>/g)].map((m) => [m[2], m[1]]) : [];
  is("... the dux sings its text: Odyssey 1.1's 17 syllables under its notes, each on the first note of its melisma, its place in its word (ἄν-δρα μοι)",
     syls.length === 17 && syls.map((x) => x[0]).join(" ").startsWith("ἄν δρα μοι ἔν νε πε Μοῦ σα") && / wordpos="i" con="d"/.test(syls[0][1]) && / wordpos="t"/.test(syls[1][1]) && !/wordpos/.test(syls[2][1])
     && (saved[0].text.match(/<note [^>]*>(?!<verse)|<note [^>]*\/>/g) || []).length > 0);
  d.getElementById("style").value = "greek";
  P.set("odyssey", "melody");
  await wait(() => total() === "1,035,536,158,789,085,949" && status() === "sung");
  is("the Greek style (learned from Mesomedes): Odyssey 1.1, 1,035,536,158,789,085,949 melodies, sung, every rule kept", total() === "1,035,536,158,789,085,949" && /✓ every rule kept/.test(report()));
  d.getElementById("melisma").value = "1";
  P.set("odyssey", "heterophony");
  await wait(() => total() === "465,209,704,599,378,834" && status() === "sung");
  is("with an aulos in heterophony (Greek style, a note a syllable): 465,209,704,599,378,834, the voice and the aulos drawn, every rule kept",
     total() === "465,209,704,599,378,834" && d.querySelectorAll("#sheet rect.comes").length > 0 && /✓ every rule kept/.test(report()));
  P.set("odyssey", "drone");
  await wait(() => /^\d/.test(total()) && status() === "sung");
  is("... and as a drone: the final held under the melody", d.querySelectorAll("#sheet rect.comes").length === 1 && /✓ every rule kept/.test(report()));
  // a Greek tonos: Seikilos in the Iastian, as the stele has it
  d.getElementById("melisma").value = "3"; d.getElementById("style").value = "engine"; d.getElementById("strict").checked = false;
  P.greek(true); P.set("seikilos", "melody");
  await wait(() => total() === "45,786,887,676,467,977,169,702,651,733,325,568,672" && status() === "sung" && !d.getElementById("stele").hidden);
  is("in a Greek tonos: Seikilos's song in the Iastian, its final e (the lichanos meson) — 45,786,887,676,467,977,169,702,651,733,325,568,672 melodies, sung, every rule kept",
     total() === "45,786,887,676,467,977,169,702,651,733,325,568,672" && /✓ every rule kept/.test(report()) && d.getElementById("gfinal").value === "-1"
     && d.getElementById("tonos").value === "iastian");
  P.stele();
  is("... the stele's melody as the stele has it (no octave down): every rule kept, six melismas", P.state().stele && /✓ every rule kept/.test(report()) && /melismas 6/.test(report()));
  // sung by Study 75's voice: the stele's melody, its syllables and its pitches as the Iastian has them, in Koine
  d.getElementById("timbre").value = "voice";
  const v = await P.play();
  const ln = [...P.lyricNotes()];
  is("sung by the voice (Study 75): every note with its syllable and its pitch in the system, in the stele's Koine",
     v && v.notes.length === ln.length && v.pron === "koine" && v.seconds > 5 &&
     [...v.notes].every((n, i) => n.midi === P.midiOf(ln[i].code) && (n.syl || "") === (ln[i].first ? ln[i].text : "")) && /sung by the voice/.test(status()));
  d.getElementById("timbre").value = "tone";
  // the Greek counterpoint: Odyssey 1.1 with an aulos in heterophony, in the Lydian
  d.getElementById("melisma").value = "1";
  P.set("odyssey", "melody"); P.greek(true);
  d.getElementById("tonos").value = "lydian"; d.getElementById("genus").value = "diatonic"; d.getElementById("tonos").dispatchEvent(new Event("change"));
  await wait(() => /^\d/.test(total()) && status() === "sung");
  d.getElementById("gfinal").value = "0";
  P.set("odyssey", "heterophony");
  await wait(() => total() === "14,338,522,811,655,342,992" && status() === "sung");
  is("the Greek counterpoint: Odyssey 1.1 in the Lydian with an aulos in heterophony — 14,338,522,811,655,342,992 ways, the voice and the aulos drawn, every rule kept",
     total() === "14,338,522,811,655,342,992" && d.querySelectorAll("#sheet rect.comes").length > 0 && /✓ every rule kept/.test(report()));
  // the ison as a bass: Seikilos in the Iastian, the voice and the ison written together (a note a syllable)
  P.set("seikilos", "bass");
  await wait(() => total() === "1,995,346,557,551,214,295" && status() === "sung");
  is("the ison as a bass: Seikilos's song in the Iastian, a note a syllable, the voice and an ison that changes only where a line begins — 1,995,346,557,551,214,295 ways, both drawn, every rule kept",
     total() === "1,995,346,557,551,214,295" && d.querySelectorAll("#sheet rect.comes").length >= 1 && d.querySelectorAll("#sheet rect.comes").length <= 4 && /✓ every rule kept/.test(report()));
  P.set("seikilos", "over");
  await wait(() => total() === "264,609,347,386,261,837" && status() === "sung");
  is("... and the voice over the drone: 264,609,347,386,261,837 melodies, every strong beat a concord with it", total() === "264,609,347,386,261,837" && d.querySelectorAll("#sheet rect.comes").length === 1 && /✓ every rule kept/.test(report()));
  P.greek(false);
  is("no errors on the page", errors.length === 0 && !/^Error/.test(status()));
} catch (e) { is("error: " + (e.message || e), false); }
const bad = results.filter((r) => !r[1]);
window.kairoticResults = { total: results.length, failed: bad.map((r) => r[0]).concat(errors) };
document.getElementById("out").textContent = `${results.length - bad.length} / ${results.length} passed\n\n` + results.map(([w, ok]) => (ok ? "  ok   " : "  FAIL ") + w).join("\n") + (errors.length ? "\n\nerrors:\n" + errors.join("\n") : "");
</script>
