<!doctype html>
<meta charset="utf-8">
<title>Study 47 · heads · tests</title>
<pre id="out">Running…</pre>
<script src="https://cdn.jsdelivr.net/npm/scittle@0.7.30/dist/scittle.js"></script>
<script type="module">
// The model (kairotic/heads.cljs), then its tests, as the study loads them.
try {
  const srcs = await Promise.all(["../kairotic/heads.cljs", "heads.cljs"].map((m) => fetch(m, { cache: "no-cache" }).then((r) => r.text())));
  for (const s of srcs) scittle.core.eval_string(s);
} catch (e) {
  document.getElementById("out").textContent = "Error: " + (e.message || e);
  window.kairoticResults = { total: 0, failed: ["error: " + (e.message || e)] };
}
</script>
