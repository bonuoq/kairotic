# Publishes an official package (npm @kairotic/<name>) when a tag <name>-vX.Y.Z is pushed, for example by
# creating a GitHub release with that tag: synth-v0.1.0 → @kairotic/synth. The packages live in
# packages/<name> and are built with packages/build.mjs; the relay (relay-v0.1.1 → @kairotic/relay)
# lives in relay/ and has nothing to build. The app itself (app-vX.Y.Z → @kairotic/app, version in app/package.json)
# is published from _app/, made by site/build.mjs, for the claude.ai shell (site/shell.html).
#
# Authentication: trusted publishing (OIDC), no tokens. npm only lets a trusted publisher be set on a
# package that already exists, so the first version of each package is published by hand; then, on
# npmjs.com, in that package's settings, this repository and this file (publish-packages.yml) are its
# trusted publisher, with direct publishing enabled under "Allowed actions".
name: publish-packages

on:
  push:
    tags: ["*-v[0-9]*"]  # <name>-vX.Y.Z for any packages/<name> (or relay); a tag without its package fails the check below

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Recent npm (trusted publishing needs npm ≥ 11.5.1)
        run: npm install -g npm@latest
      - name: Which package, and does the tag match its version
        run: |
          NAME="${GITHUB_REF_NAME%-v*}"
          if [ "$NAME" = relay ]; then DIR=relay; elif [ "$NAME" = app ]; then DIR=app; else DIR="packages/$NAME"; fi
          test -f "$DIR/package.json" || { echo "No package $DIR"; exit 1; }
          V=$(node -p "require('./$DIR/package.json').version")
          test "$NAME-v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $V"; exit 1; }
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          # the app is published from what site/build.mjs makes of it (_app/), not from app/ itself
          if [ "$NAME" = app ]; then echo "OUT=_app" >> "$GITHUB_ENV"; else echo "OUT=$DIR" >> "$GITHUB_ENV"; fi
      # The page brings each official package from npm at the version core/kairotic/library.cljs pins: a
      # release whose pin was not moved with its package.json would publish a version the page never loads
      # (tests/versions.mjs checks every package; this checks the one being published, before publishing).
      - name: Does the page pin this version
        if: env.NAME != 'relay' && env.NAME != 'app'
        run: node tests/versions.mjs "@kairotic/$NAME"
      - if: env.NAME != 'relay' && env.NAME != 'app'
        run: node packages/build.mjs "$NAME"
      - if: env.NAME == 'app'
        run: node site/build.mjs
      # Every package carries the project's licence and THIRD_PARTY.md (the third-party code Kairotic adapts or
      # bundles, with its notices; LICENSES/ holds the texts it points to): npm keeps LICENSE by itself, the others
      # are added to a "files" list where the package has one. tests/licences.mjs checks this step is here.
      - name: The licence and the third-party notices
        run: |
          cp LICENSE THIRD_PARTY.md "$OUT"/
          cp -r LICENSES "$OUT"/
          node -e 'const f=process.argv[1], p=JSON.parse(require("fs").readFileSync(f)); if (p.files) { for (const x of ["THIRD_PARTY.md","LICENSES"]) if (!p.files.includes(x)) p.files.push(x); require("fs").writeFileSync(f, JSON.stringify(p, null, 2) + "\n"); }' "$OUT/package.json"
      # A version already on npm (a first version published by hand, before its trusted publisher could be set)
      # is not published again — npm would refuse it —: the run ends green, with a notice.
      - name: Is this version already on npm
        run: |
          PKG=$(node -p "require('./$DIR/package.json').name") V=$(node -p "require('./$DIR/package.json').version")
          if npm view "$PKG@$V" version > /dev/null 2>&1; then echo "::notice::$PKG@$V is already on npm: not published again"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - if: env.SKIP != '1'
        run: npm publish --access public
        working-directory: ${{ env.OUT }}
      # the claude.ai shell asks jsDelivr for @kairotic/app@latest: forget the old answer so the new version is seen at
      # once. A purge before npm serves the new version would only make jsDelivr resolve the old one again (and keep it
      # for hours), so: wait for the registry, purge, and check what jsDelivr serves, purging again until it is the new one
      - if: env.NAME == 'app'
        run: |
          V=$(node -p "require('./app/package.json').version")
          for i in $(seq 1 30); do [ "$(npm view "@kairotic/app@$V" version 2>/dev/null)" = "$V" ] && break; sleep 10; done
          for i in $(seq 1 12); do
            curl -fsS "https://purge.jsdelivr.net/npm/@kairotic/app@latest/sources.mjs" > /dev/null || true
            sleep 20
            got=$(curl -fsS "https://cdn.jsdelivr.net/npm/@kairotic/app@latest/sources.mjs?check=$i" | grep -o '"version":"[^"]*"' | head -1 || true)
            echo "jsDelivr serves $got"
            [ "$got" = "\"version\":\"$V\"" ] && exit 0
          done
          echo "::warning::jsDelivr still serves an older @kairotic/app@latest: purge https://purge.jsdelivr.net/npm/@kairotic/app@latest/sources.mjs by hand later"
