# The Developer Certificate of Origin (https://developercertificate.org/, see CONTRIBUTING.md): every commit of a
# pull request is authored by a person and carries that person's Signed-off-by.
#
#   - the Signed-off-by must have the author's own email (what `git commit -s` writes when you are the author)
#   - an AI assistant is never the author (AI_AUTHORS below): it is credited with a Co-Authored-By line, and the
#     person who directed the work is the author and signs off — an assistant cannot hold copyright nor certify
#   - merge commits and GitHub's bots (…[bot]@users.noreply.github.com, e.g. the vendor workflow) are not checked
#
# Like every DCO check, this reads what a commit says about itself; it is an attestation, not an authentication.
# Requiring signed commits on main (branch protection) is what binds an author to a key.
# It reads the commits through the API, so it needs no checkout and works for pull requests from forks.
name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          AI_AUTHORS: "noreply@anthropic.com"
        with:
          script: |
            const ai = new Set(process.env.AI_AUTHORS.split(/[\s,]+/).filter(Boolean).map((e) => e.toLowerCase()));
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, per_page: 100 });
            const bad = [];
            for (const c of commits) {
              if (c.parents.length > 1) continue;
              const author = (c.commit.author.email || "").toLowerCase();
              if (author.endsWith("[bot]@users.noreply.github.com")) continue;
              const signers = [...c.commit.message.matchAll(/^Signed-off-by:\s*.+?<([^>]+)>\s*$/gim)]
                .map((m) => m[1].trim().toLowerCase());
              const ok = !ai.has(author) && signers.includes(author);
              if (!ok) bad.push({ sha: c.sha.slice(0, 7), subject: c.commit.message.split("\n")[0], author,
                                  why: ai.has(author)
                                    ? "authored by an AI assistant: the person who directs the work is the author (credit the assistant with Co-Authored-By)"
                                    : signers.length ? "Signed-off-by does not match the author's email (" + author + ")"
                                                     : "no Signed-off-by" });
            }
            core.info(`${commits.length} commit(s), ${bad.length} without a valid sign-off.`);
            if (bad.length) {
              for (const b of bad) core.error(`${b.sha} ${b.subject} — ${b.why}`);
              core.setFailed("Some commits are not authored and signed off by a person. As their author: `git rebase " +
                context.payload.pull_request.base.ref + " --exec 'git commit --amend --no-edit --reset-author --signoff'` " +
                "and `git push --force-with-lease` (see CONTRIBUTING.md, DCO).");
            }
