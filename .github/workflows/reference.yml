# Keeps docs/reference.md (the class reference) as the help of the app says: on every push to main
# that touches the help or the classes, the built app writes it ((reference-md)) and, if it changed,
# it is committed.
name: reference

on:
  push:
    branches: [main]
    paths: ["core/**", "app/**", "packages/*/src/**", ".github/workflows/reference.yml", "tests/reference.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Serve the built app
        run: (cd _site && python3 -m http.server 8000 &) && sleep 2
      - run: node tests/reference.mjs http://localhost:8000/?embed
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- docs/reference.md && git ls-files --error-unmatch docs/reference.md >/dev/null 2>&1; then
            echo "docs/reference.md is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/reference.md
            git commit -m "docs: class reference, from the help (generated)"
            git push
          fi
