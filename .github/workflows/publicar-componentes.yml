# Publica kairotic-componentes en npm al subir una etiqueta componentes-vX.Y.Z.
# Necesita el secreto NPM_TOKEN (token "Automation" de npmjs.com) en Settings → Secrets → Actions.
name: publicar-componentes

on:
  push:
    tags: ["componentes-v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: componentes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          V=$(node -p "require('./package.json').version")
          test "componentes-v$V" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $V"; exit 1; }
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
