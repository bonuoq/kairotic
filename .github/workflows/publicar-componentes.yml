# Publica kairotic-componentes en npm al subir una etiqueta componentes-vX.Y.Z.
#
# Autenticación: trusted publishing (OIDC). En npmjs.com, en los ajustes del paquete, este repositorio
# y este archivo (publicar-componentes.yml) figuran como publicador de confianza: no hace falta ningún
# token. La procedencia (provenance) solo se genera desde repositorios públicos; mientras el repositorio
# sea privado se publica sin ella. Si npm deja la versión en espera, se aprueba en npmjs.com.
name: publicar-componentes

on:
  push:
    tags: ["componentes-v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: componentes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm reciente (trusted publishing necesita npm ≥ 11.5.1)
        run: npm install -g npm@latest
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          V=$(node -p "require('./package.json').version")
          test "componentes-v$V" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $V"; exit 1; }
      - run: npm run build
      - run: npm publish --access public
