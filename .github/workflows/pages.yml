# Builds Kairotic Pages (site/build.mjs → _site/: the app of app/ with the modules of core/ and what
# components/, packages/, examples/ and docs/tutorials/ generate) and deploys it to GitHub Pages on
# every push to main that touches any of them, or by hand from the Actions tab.
#
# Needs, once: Settings → Pages → Source: "GitHub Actions". GitHub Pages works on public repositories
# with every plan, and on private ones only with a paid plan (Pro, Team, Enterprise).
name: pages

on:
  push:
    branches: [main]
    paths: ["app/**", "core/**", "site/**", "components/**", "packages/**", "examples/**", "docs/tutorials/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
