# Publishes kairotic-components to npm when a tag components-vX.Y.Z is pushed
# (for example by creating a GitHub release with that tag).
#
# Authentication: trusted publishing (OIDC), no tokens. On npmjs.com, in the package settings,
# this repository and this file (publish-components.yml) are the trusted publisher, with direct
# publishing enabled under "Allowed actions". Provenance is only generated from public
# repositories; while the repository is private it is published without it.
name: publish-components

on:
  push:
    tags: ["components-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Recent npm (trusted publishing needs npm ≥ 11.5.1)
        run: npm install -g npm@latest
      - name: Check that the tag matches package.json
        run: |
          V=$(node -p "require('./package.json').version")
          test "components-v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $V"; exit 1; }
      - run: npm run build
      - run: npm publish --access public
