# Runs the studies' own test pages (studies/*/tests/*.html, see tests/studies.mjs) in a headless Chromium,
# on pull requests that touch the studies, and by hand.
name: studies

on:
  pull_request:
    paths: ["studies/**", "tests/studies.mjs", ".github/workflows/studies.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the same image and playwright version as tests.yml; change them together
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.56.0
      - name: Serve the repository and run the studies' tests
        run: |
          npx --yes http-server@14 . -p 8000 -s &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/README.md > /dev/null && break; sleep 1; done
          node tests/studies.mjs http://localhost:8000/
